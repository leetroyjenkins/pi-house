services:
  db:
    image: postgres:16
    container_name: pi_house_db
    environment:
      POSTGRES_DB: pi_house_db
      POSTGRES_USER: pi_house_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - pi_house_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pi_house_user -d pi_house_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: pi-house:latest
    build: .
    container_name: pi_house_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://pi_house_user:${DB_PASSWORD}@db:5432/pi_house_db
      SECRET_KEY: ${SECRET_KEY}
      FLASK_ENV: production
    networks:
      - pi_house_network
    restart: unless-stopped
    ports:
      - "5000:5000"

networks:
  pi_house_network:
    driver: bridge

volumes:
  db_data:
