name: Build and Deploy to Raspberry Pi

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main  # Auto-deploy on push to main (after PR merge)
  pull_request:
    branches:
      - main  # Run tests on PRs targeting main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v || echo "No tests yet - skipping"

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Build Docker image for ARM64
        run: |
          docker buildx build --platform linux/arm64 -t pi-house:${{ github.sha }} --load .
          docker save pi-house:${{ github.sha }} > pi-house.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v7.0.0
        with:
          name: docker-image
          path: pi-house.tar

      - name: Upload docker-compose.yml
        uses: actions/upload-artifact@v7.0.0
        with:
          name: docker-compose
          path: docker-compose.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production  # Requires manual approval
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.1
        with:
          name: docker-image

      - name: Download docker-compose.yml
        uses: actions/download-artifact@v8.0.1
        with:
          name: docker-compose

      - name: Deploy to Raspberry Pi
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          source: "docker-compose.yml,pi-house.tar"
          target: "~/apps/budget"

      - name: Start containers on Pi
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          script: |
            cd ~/apps/budget
            docker load < pi-house.tar
            docker tag pi-house:${{ github.sha }} pi-house:latest
            docker compose down
            docker compose up -d --no-build
            rm pi-house.tar
            docker compose ps
            echo "Deployment complete!"
